[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiguard"
version = "0.1.0"
description = "A filesystem-level guard that keeps coding agents away from forbidden files and logs reads."
authors = [{ name = "AI Guard Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fusepy>=3.0.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
aiguard = "aiguard.cli:main"

[tool.setuptools.packages.find]
include = ["aiguard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
